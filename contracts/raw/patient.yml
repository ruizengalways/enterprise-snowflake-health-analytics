schema_version: 2
contract:
  source_system: ehr_mssql
  entity: patient
  grain: one row per source-system patient identifier and source change
  business_key:
    - patient_id
  source_timestamp: source_updated_at
  columns:
    - name: patient_id
      type: VARCHAR
      nullable: false
      classification: confidential
    - name: source_updated_at
      type: TIMESTAMP_NTZ
      nullable: false
      classification: internal
    - name: source_operation
      type: VARCHAR
      nullable: false
      classification: internal
    - name: source_sequence
      type: NUMBER
      nullable: false
      classification: internal
    - name: ingested_at
      type: TIMESTAMP_NTZ
      nullable: false
      classification: internal
  change_semantics:
    mode: cdc
    operation_column: source_operation
    sequence_column: source_sequence
    delete_semantics: tombstone
    delete_values:
      - D
  capture_fidelity: full_change
  ordering_columns:
    - source_updated_at
    - source_sequence
  idempotency_key:
    - patient_id
    - source_sequence
  breaking_change_policy: versioned_contract
