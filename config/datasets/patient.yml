schema_version: 2

dataset:
  id: patient
  owner_team: health-data
  raw_contract: contracts/raw/patient.yml
  load:
    strategy: scd1
    business_key:
      - patient_id
    watermark_column: source_updated_at
  materialization:
    type: table
  runtime:
    mode: dbt
  compute:
    workload: transform
  quality:
    freshness:
      warn_after_minutes: 60
      error_after_minutes: 120
    reconciliation:
      enabled: true
      measures:
        - row_count
        - distinct_business_key
        - min_max_source_timestamp
