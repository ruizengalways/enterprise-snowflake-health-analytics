name: Health dbt v2 CI

on:
  pull_request:
    paths: ["dbt/**", "config/**", "contracts/**", ".github/workflows/dbt-static-ci.yml"]
  push:
    branches: [main]
    paths: ["dbt/**", "config/**", "contracts/**", ".github/workflows/dbt-static-ci.yml"]

permissions:
  contents: read

jobs:
  dbt-offline:
    runs-on: ubuntu-latest
    env:
      ESF_ENVIRONMENT: dev
      SNOWFLAKE_ACCOUNT: offline
      SNOWFLAKE_USER: offline
      DBT_DATABASE: OFFLINE_HEALTH
      DBT_WAREHOUSE: OFFLINE_TRANSFORM
      DBT_DEFAULT_SCHEMA: SILVER_STAGING
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ruizengalways/enterprise-snowflake-data-project-framework
          ref: 7d3498f8b5ef48d868ea44aade62cf13e50e58f6
          path: framework
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install dbt-core==1.12.3 dbt-snowflake==1.12.0
          python -m pip install -e framework
      - name: Validate metadata and parse patient SCD1
        shell: bash
        run: |
          set -euo pipefail
          python framework/validation/validate_metadata.py --project-root . --schema-dir framework/project_schema
          VARS="$(python framework/scripts/render_dbt_vars.py --project-root . --schema-dir framework/project_schema)"
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt parse --no-partial-parse --project-dir dbt --profiles-dir dbt --vars "$VARS"
          jq -e '.nodes | to_entries | any(.value.name == "patient" and .value.config.materialized == "esf_scd1_current")' dbt/target/manifest.json >/dev/null
      - name: Assert Health semantics remain SCD1
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'strategy: scd1' config/datasets/patient.yml
          grep -Fq 'qualify row_number() over' dbt/models/silver_canonical/patient.sql
          grep -Fq 'schema_version: 2' contracts/raw/patient.yml
          grep -Fq 'delete_values:' contracts/raw/patient.yml
          if grep -R -n -E 'load_strategy|scd1_merge|scd2_merge|scd2_snapshot|scd2_stream_task|checkpoint_kind' config contracts dbt/models; then exit 1; fi
      - name: Assert v2 processing reset contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=dbt/macros/reset_contract.sql
          test -f "$FILE"
          grep -Fq 'health_patient_full_reset' "$FILE"
          grep -Fq 'esf_execute_dataset_full_reset' "$FILE"
          grep -Fq '.SILVER_CANONICAL.PATIENT' "$FILE"
          grep -Fq "'dev': 'DEV_HEALTH'" "$FILE"
          grep -Fq 'ESF_SCHEMA_PREFIX' "$FILE"
          grep -Fq "'bronze_preserved', TRUE" "$FILE"
          if grep -Fq '.BRONZE.' "$FILE"; then exit 1; fi
          if grep -Eq 'SILVER_STAGING|GOLD_MARTS' "$FILE"; then exit 1; fi
