name: dbt Static CI

on:
  pull_request:
    paths:
      - "dbt/**"
      - "config/**"
      - "contracts/**"
      - ".github/workflows/dbt-static-ci.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "dbt/**"
      - "config/**"
      - "contracts/**"
      - ".github/workflows/dbt-static-ci.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  parse:
    name: Validate dbt project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Parse with pinned framework
        uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/actions/dbt-static-check@02e3fca78b453e8a39a1722ce96b15dfc98d7cf8
        with:
          project-code: HEALTH
          project-dir: dbt
          project-root: .

      - name: Assert one-click deploy wrapper contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/deploy.yml"
          INPUTS="$(sed -n '/^[[:space:]]*inputs:/,/^permissions:/p' "$FILE")"

          grep -Fq 'environment:' <<<"$INPUTS"
          if grep -Fq 'git_sha:' <<<"$INPUTS"; then
            echo "Health Deploy UI must not expose a manual git_sha input." >&2
            exit 1
          fi

          grep -Fq 'uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/workflows/project-deploy.yml@02e3fca78b453e8a39a1722ce96b15dfc98d7cf8' "$FILE"
          grep -Fq 'project_code: HEALTH' "$FILE"
          grep -Eq '^[[:space:]]+git_sha:.*github[.]sha' "$FILE"
          grep -Fq 'framework_ref: 02e3fca78b453e8a39a1722ce96b15dfc98d7cf8' "$FILE"

          if grep -Eq 'ACTIONS_ID_TOKEN_REQUEST|SNOWFLAKE_TOKEN|SNOWFLAKE_OIDC_AUDIENCE' "$FILE"; then
            echo "Health wrapper must delegate WIF/token handling to the reusable framework workflow." >&2
            exit 1
          fi

      - name: Render Health operational control contract
        shell: bash
        run: |
          set -euo pipefail
          dbt run-operation health_operational_contract_sql \
            --vars "$(cat "${RUNNER_TEMP}/esf-dbt-vars.json")" \
            --project-dir dbt \
            --profiles-dir dbt \
            | tee "${RUNNER_TEMP}/health-operational-contract.txt"

      - name: Assert Health domain isolation contract
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/health-operational-contract.txt"
          grep -qi "from PLATFORM_CONTROL.OPERATIONS.HEALTH_PIPELINE_CHECKPOINT" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.HEALTH_ADVANCE_PIPELINE_CHECKPOINT" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.HEALTH_PIPELINE_RUN_START" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.HEALTH_PIPELINE_RUN_FINISH" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.HEALTH_RECORD_PIPELINE_CHECK_RESULT" "$FILE"
          if grep -qi "call PLATFORM_CONTROL.OPERATIONS.ADVANCE_PIPELINE_CHECKPOINT" "$FILE"; then
            echo "Health runtime contract must not call the generic checkpoint procedure." >&2
            exit 1
          fi
          if grep -qi "merge into PLATFORM_CONTROL.OPERATIONS.PIPELINE_RUN" "$FILE"; then
            echo "Health runtime contract must not write directly to the shared run ledger." >&2
            exit 1
          fi

      - name: Render Health dataset config snapshot contract
        shell: bash
        run: |
          set -euo pipefail
          dbt run-operation health_patient_config_snapshot_contract_sql \
            --vars "$(cat "${RUNNER_TEMP}/esf-dbt-vars.json")" \
            --project-dir dbt \
            --profiles-dir dbt \
            | tee "${RUNNER_TEMP}/health-config-snapshot-contract.txt"

      - name: Assert Health config snapshot isolation contract
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/health-config-snapshot-contract.txt"
          grep -qi "from PLATFORM_CONTROL.CONFIG.HEALTH_DATASET_CONFIG_SNAPSHOT" "$FILE"
          grep -qi "call PLATFORM_CONTROL.CONFIG.HEALTH_REGISTER_DATASET_CONFIG_SNAPSHOT" "$FILE"
          grep -qi "patient" "$FILE"
          if grep -Eqi "(insert|update|merge|delete)[[:space:]].*PLATFORM_CONTROL\.CONFIG\.DATASET_CONFIG_SNAPSHOT" "$FILE"; then
            echo "Health config contract must not DML the shared config snapshot table directly." >&2
            exit 1
          fi
